name: Apple SDL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sdk: [macosx, iphonesimulator, iphoneos]
    steps:
      - uses: actions/checkout@v4
      - name: Generate sprites with the host compiler
        run: make -f Makefile.sdl CC=clang bitmaps/sprites
      - name: Build application
        shell: bash
        run: |
          sdk=${{ matrix.sdk }}
          flags=()
          if [[ $sdk != macosx ]]; then
            flags+=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0)
          fi
          cmake -S apple -B build/apple -G Xcode "-DCMAKE_OSX_SYSROOT=$sdk" "${flags[@]}" -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          cmake --build build/apple --config Release --target xmris --parallel 4
          app=$(find build/apple -name xmris.app -type d -print -quit)
          test -n "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Check macOS executable
        if: matrix.sdk == 'macosx'
        run: '"$APP/Contents/MacOS/xmris" -help'
      - name: Launch on an iPhone simulator
        if: matrix.sdk == 'iphonesimulator'
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id" -b
          xcrun simctl install "$id" "$APP"
          xcrun simctl launch "$id" org.xmris.game
      - name: Package
        run: ditto -c -k --keepParent "$APP" xmris.zip
      - uses: actions/upload-artifact@v4
        with:
          name: xmris-${{ matrix.sdk }}
          path: xmris.zip
